<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>RE:ON 영업관리</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.10.0/dist/tabler-icons.min.css"/>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
:root{
  --bg:#fff;--bg2:#f5f5f4;--bg3:#eeede9;
  --text:#1a1a18;--text2:#6b6b67;--text3:#9d9c98;
  --border:rgba(0,0,0,.12);--border2:rgba(0,0,0,.22);
  --ok-bg:#eaf3de;--ok-txt:#3b6d11;
  --warn-bg:#faeeda;--warn-txt:#854f0b;
  --err-bg:#fcebeb;--err-txt:#a32d2d;
  --r-md:8px;--r-lg:12px;
  --navy:#0D2B55;--gold:#C9A84C;
  --rental:#0D2B55;
}
body{font-family:-apple-system,BlinkMacSystemFont,'Noto Sans KR',sans-serif;background:#f8f8f6;color:var(--text);font-size:14px;overflow-x:hidden;}
.app{display:flex;flex-direction:column;height:100vh;}

/* ── 최상단 앱 탭 (구독/렌탈 전환) ── */
.app-header{background:var(--navy);padding:0 1.5rem;display:flex;align-items:center;gap:0;flex-shrink:0;}
.app-logo{color:var(--gold);font-size:13px;font-weight:700;letter-spacing:.5px;padding:0 16px 0 0;border-right:1px solid rgba(255,255,255,.2);margin-right:16px;white-space:nowrap;}
.app-tab{padding:14px 20px;font-size:13px;font-weight:500;color:rgba(255,255,255,.55);border:none;background:none;cursor:pointer;border-bottom:2px solid transparent;transition:color .15s,border-color .15s;white-space:nowrap;}
.app-tab.active{color:#fff;border-bottom-color:var(--gold);}
.app-tab:hover:not(.active){color:rgba(255,255,255,.8);}

/* ── 페이지 컨테이너 ── */
.page{display:none;flex:1;overflow:auto;}
.page.active{display:block;}
.container{max-width:1600px;margin:0 auto;padding:1.25rem 1rem;}

/* ── 상단 바 ── */
.top-bar{display:flex;align-items:center;justify-content:space-between;margin-bottom:1rem;flex-wrap:wrap;gap:8px;}
.page-title{font-size:16px;font-weight:500;display:flex;align-items:center;gap:8px;}
.badge{font-size:11px;font-weight:600;padding:2px 8px;border-radius:4px;letter-spacing:.4px;}
.badge-sub{background:var(--navy);color:var(--gold);}
.badge-rental{background:var(--navy);color:var(--gold);}

/* ── 통계 ── */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px;margin-bottom:1rem;}
.stat{background:var(--bg);border-radius:var(--r-md);padding:.65rem 1rem;border:.5px solid var(--border);}
.stat-label{font-size:11px;color:var(--text2);margin-bottom:3px;}
.stat-value{font-size:19px;font-weight:500;}

/* ── 폼 요소 ── */
input[type=text],input[type=date],select,textarea{border:.5px solid var(--border2);border-radius:var(--r-md);padding:7px 10px;font-size:13px;font-family:inherit;background:var(--bg);color:var(--text);outline:none;transition:border-color .15s;}
input[type=text]:focus,input[type=date]:focus,select:focus,textarea:focus{border-color:var(--navy);}
button{font-family:inherit;cursor:pointer;}
.btn-primary{background:var(--navy);color:var(--gold);border:none;border-radius:var(--r-md);padding:8px 14px;font-size:13px;font-weight:500;display:inline-flex;align-items:center;gap:5px;}
.btn-primary:hover{background:#163d7a;}
.btn-primary.rental{background:var(--navy);}
.btn-primary.rental:hover{background:#163d7a;}
.btn-sm{font-size:12px;padding:5px 10px;border-radius:6px;border:.5px solid var(--border2);background:var(--bg);color:var(--text2);}
.btn-sm:hover{background:var(--bg2);}
.btn-danger{font-size:12px;padding:5px 10px;border-radius:6px;border:.5px solid #f0a0a0;background:transparent;color:var(--err-txt);}
.btn-danger:hover{background:var(--err-bg);}
.btn-transfer{font-size:11px;padding:4px 9px;border-radius:6px;border:.5px solid var(--border2);background:transparent;color:var(--text2);display:inline-flex;align-items:center;gap:3px;}
.btn-transfer:hover{background:var(--bg2);}

/* ── 툴바 ── */
.toolbar{display:flex;gap:8px;margin-bottom:1rem;flex-wrap:wrap;align-items:center;}
.toolbar input[type=text]{flex:1;min-width:160px;}
.tab-bar{display:flex;gap:0;margin-bottom:1rem;border:.5px solid var(--border2);border-radius:var(--r-md);overflow:hidden;width:fit-content;}
.tab-btn{padding:6px 16px;font-size:13px;font-family:inherit;border:none;background:var(--bg);color:var(--text2);cursor:pointer;}
.tab-btn.active{background:var(--navy);color:var(--gold);font-weight:500;}
.tab-btn.active.rental{background:var(--navy);}
.tab-btn:not(.active):hover{background:var(--bg2);}

/* ── 테이블 ── */
.table-wrap{overflow-x:auto;border:.5px solid var(--border);border-radius:var(--r-lg);background:var(--bg);}
table{width:100%;border-collapse:collapse;min-width:1100px;}
thead th{background:var(--bg2);font-weight:500;font-size:11px;color:var(--text2);padding:9px 10px;text-align:left;border-bottom:.5px solid var(--border);white-space:nowrap;}
thead th.th-amt{text-align:right;background:#0D2B5509;}
thead th.th-amt.rental{background:#0D2B5509;}
tbody tr{border-bottom:.5px solid var(--border);transition:background .1s;}
tbody tr:last-child{border-bottom:none;}
tbody tr:hover{background:var(--bg2);}
tbody td{padding:9px 10px;vertical-align:middle;}
td.td-amt{text-align:right;background:#0D2B5504;max-width:75px;}
td.td-amt.rental{background:#0D2B5504;}
td.td-amt-total{text-align:right;font-weight:500;color:var(--navy);background:#0D2B5509;max-width:90px;}
td.td-amt-total.rental{color:var(--navy);background:#0D2B5509;}
.td-sub{color:var(--text2);font-size:12px;}
.name-link{font-weight:500;color:var(--navy);cursor:pointer;border-bottom:1px dashed transparent;transition:border-color .15s;}
.name-link.rental{color:var(--navy);}
.name-link:hover{border-bottom-color:currentColor;}
.cnt-badge{font-size:10px;color:var(--text3);margin-left:4px;}
.amt-input{width:100%;text-align:right;font-size:12px;border:none;background:transparent;color:var(--text);outline:none;cursor:pointer;font-variant-numeric:tabular-nums;padding:2px 0;font-family:inherit;}
.amt-input:focus{background:var(--bg2);border-radius:4px;cursor:text;padding:2px 4px;}
.amt-input::placeholder{color:var(--text3);}
.empty{padding:2.5rem;text-align:center;color:var(--text2);font-size:14px;}

/* ── 상태 배지 ── */
.status-sel{display:inline-block;font-size:11px;font-weight:500;padding:3px 8px;border-radius:20px;border:none;cursor:pointer;font-family:inherit;}
.status-badge{display:inline-block;font-size:10px;font-weight:500;padding:2px 8px;border-radius:20px;white-space:nowrap;}
.s-contract   {background:#0D2B5520;color:var(--navy);font-weight:600;}
.s-pending    {background:#e8d5f5;color:#6a1b9a;font-weight:600;}
.s-alliance   {background:#0D2B5520;color:var(--navy);font-weight:600;}
.s-singlesale {background:#d4edda;color:#155724;font-weight:600;}
.s-meeting    {background:#fff3cd;color:#856404;}
.s-sent       {background:#cce5ff;color:#004085;}
.s-keep       {background:#e2e3e5;color:#383d41;}
.s-absent     {background:var(--warn-bg);color:var(--warn-txt);}
.s-lowint     {background:var(--err-bg);color:var(--err-txt);}

/* ── 컨택 타입 배지 ── */
.type-badge{display:inline-flex;align-items:center;gap:3px;font-size:11px;font-weight:500;padding:2px 8px;border-radius:20px;}
.type-visit{background:#0D2B5512;color:var(--navy);}
.type-call{background:var(--ok-bg);color:var(--ok-txt);}
.type-email{background:var(--warn-bg);color:var(--warn-txt);}
.type-other{background:var(--bg2);color:var(--text2);}

/* ── 일자별 컨택 뷰 ── */
.daily-wrap{display:none;}
.daily-wrap.show{display:block;}
.daily-group{margin-bottom:1.5rem;}
.daily-date-header{font-size:13px;font-weight:500;color:var(--navy);padding:8px 14px;background:#0D2B5509;border-radius:var(--r-md) var(--r-md) 0 0;border:.5px solid var(--border);}
.daily-date-header.rental{color:var(--navy);background:#0D2B5509;}
.daily-item{display:flex;gap:12px;align-items:flex-start;padding:10px 14px;border:.5px solid var(--border);border-top:none;background:var(--bg);}
.daily-item:last-child{border-radius:0 0 var(--r-md) var(--r-md);}
.daily-co-name{font-weight:500;color:var(--navy);cursor:pointer;font-size:13px;min-width:120px;}
.daily-co-name.rental{color:var(--navy);}
.daily-co-name:hover{text-decoration:underline;}
.daily-text{font-size:13px;line-height:1.6;flex:1;white-space:pre-wrap;word-break:break-word;}
.daily-status{flex-shrink:0;}

/* ── 로딩/토스트 ── */
.loading-overlay{display:none;position:fixed;inset:0;background:rgba(255,255,255,.8);z-index:500;align-items:center;justify-content:center;flex-direction:column;gap:12px;}
.loading-overlay.show{display:flex;}
.spinner{width:32px;height:32px;border:3px solid var(--border2);border-top-color:var(--navy);border-radius:50%;animation:spin .7s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
.loading-msg{font-size:13px;color:var(--text2);}
.toast{position:fixed;bottom:1.5rem;left:50%;transform:translateX(-50%) translateY(20px);background:var(--navy);color:#fff;padding:9px 18px;border-radius:var(--r-md);font-size:13px;opacity:0;transition:opacity .25s,transform .25s;z-index:600;pointer-events:none;}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
.toast.err{background:var(--err-txt);}

/* ── 모달 공통 ── */
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:200;align-items:center;justify-content:center;}
.modal-overlay.open{display:flex;}
.modal{background:var(--bg);border-radius:var(--r-lg);border:.5px solid var(--border);padding:1.5rem;width:100%;max-width:560px;max-height:92vh;overflow-y:auto;}
.modal h3{font-size:16px;font-weight:500;margin-bottom:1rem;}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.form-full{grid-column:1/-1;}
.form-group label{display:block;font-size:12px;color:var(--text2);margin-bottom:4px;}
.form-group input,.form-group select,.form-group textarea{width:100%;}
.form-group textarea{resize:vertical;height:64px;}
.sec-div{grid-column:1/-1;font-size:12px;font-weight:500;color:var(--text2);padding:8px 0 4px;border-bottom:.5px solid var(--border);margin-top:4px;}
.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:1rem;}

/* ── 컨택 수정 모달 ── */
.edit-ct-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:400;align-items:center;justify-content:center;}
.edit-ct-overlay.open{display:flex;}
.edit-ct-modal{background:var(--bg);border-radius:var(--r-lg);border:.5px solid var(--border);padding:1.5rem;width:100%;max-width:500px;}
.edit-ct-modal h3{font-size:15px;font-weight:500;margin-bottom:1rem;}
.ec-row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:10px;}

/* ── 사이드 패널 ── */
.panel-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.28);z-index:300;}
.panel-overlay.open{display:block;}
.panel{position:fixed;top:0;right:-700px;width:680px;max-width:96vw;height:100vh;background:var(--bg);border-left:.5px solid var(--border);display:flex;flex-direction:column;z-index:301;transition:right .28s cubic-bezier(.4,0,.2,1);}
.panel.open{right:0;}
.ph{padding:1.25rem 1.5rem 1rem;border-bottom:.5px solid var(--border);flex-shrink:0;}
.ph-top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:.75rem;}
.ph-name{font-size:18px;font-weight:500;color:var(--navy);}
.ph-name.rental{color:var(--navy);}
.ph-meta{font-size:12px;color:var(--text2);margin-top:3px;line-height:1.6;}
.ph-close{background:none;border:none;cursor:pointer;color:var(--text2);font-size:20px;padding:2px;line-height:1;flex-shrink:0;}
.ph-chips{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:.5rem;}
.chip{background:var(--bg2);border-radius:6px;padding:4px 10px;font-size:12px;}
.chip strong{color:var(--navy);font-weight:500;margin-left:3px;}
.cf{padding:1rem 1.5rem;border-bottom:.5px solid var(--border);background:#0D2B5505;flex-shrink:0;}
.cf.rental{background:#0D2B5505;}
.cf-title{font-size:12px;font-weight:500;color:var(--text2);margin-bottom:8px;}
.cf-r1{display:grid;grid-template-columns:155px 150px 1fr;gap:8px;margin-bottom:8px;}
.cf-r2{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:flex-start;}
.cf textarea{width:100%;height:72px;resize:vertical;font-size:13px;}
.cf select,.cf input[type=date]{font-size:13px;width:100%;}
.panel-body{flex:1;overflow-y:auto;padding:1.25rem 1.5rem;}
.tl{display:flex;flex-direction:column;}
.tl-item{display:flex;gap:14px;}
.tl-item:last-child .tl-line{display:none;}
.tl-spine{display:flex;flex-direction:column;align-items:center;flex-shrink:0;width:24px;}
.tl-dot{width:11px;height:11px;border-radius:50%;margin-top:4px;flex-shrink:0;}
.tl-dot.type-visit{background:var(--navy);}
.tl-dot.type-call{background:var(--ok-txt);}
.tl-dot.type-email{background:var(--warn-txt);}
.tl-dot.type-other{background:var(--text3);}
.tl-line{width:1.5px;background:var(--border2);flex:1;min-height:14px;margin-top:4px;}
.tl-content{flex:1;padding-bottom:22px;}
.tl-header{display:flex;align-items:center;gap:7px;margin-bottom:7px;flex-wrap:wrap;}
.tl-date{font-size:12px;font-weight:500;color:var(--text2);}
.tl-card{background:var(--bg);border:.5px solid var(--border);border-radius:var(--r-md);padding:10px 14px;font-size:13px;line-height:1.75;white-space:pre-wrap;word-break:break-word;}
.tl-foot{display:flex;justify-content:flex-end;margin-top:4px;gap:8px;}
.tl-del{font-size:11px;color:var(--text3);background:none;border:none;cursor:pointer;padding:0;display:inline-flex;align-items:center;gap:3px;opacity:0;transition:opacity .15s;}
.tl-item:hover .tl-del{opacity:1;}
.tl-del:hover{color:var(--err-txt);}
.panel-empty{text-align:center;padding:3rem 1rem;color:var(--text2);font-size:14px;}

/* ── 통합 검색 ── */
.global-search-wrap{position:relative;margin:0 1.5rem 0 auto;}
.global-search-input{width:220px;font-size:13px;padding:6px 32px 6px 12px;border:.5px solid rgba(255,255,255,.3);border-radius:var(--r-md);background:rgba(255,255,255,.1);color:#fff;outline:none;transition:width .2s,background .2s,color .2s;}
.global-search-input::placeholder{color:rgba(255,255,255,.5);}
.global-search-input:focus{width:280px;background:#fff;border-color:var(--gold);color:var(--text);}
.global-search-input:focus::placeholder{color:var(--text3);}
.global-search-input:focus + .global-search-icon{color:var(--text3);}
.global-search-icon{position:absolute;right:9px;top:50%;transform:translateY(-50%);color:rgba(255,255,255,.5);pointer-events:none;font-size:14px;}
.gs-dropdown{display:none;position:absolute;top:calc(100% + 6px);right:0;width:420px;background:var(--bg);border:.5px solid var(--border2);border-radius:var(--r-lg);box-shadow:0 8px 24px rgba(0,0,0,.15);z-index:1000;max-height:420px;overflow-y:auto;}
.gs-dropdown.show{display:block;}
.gs-section-title{font-size:11px;font-weight:500;color:var(--text3);padding:8px 14px 4px;letter-spacing:.4px;}
.gs-item{display:flex;align-items:center;gap:10px;padding:9px 14px;cursor:pointer;transition:background .1s;border-bottom:.5px solid var(--border);}
.gs-item:last-child{border-bottom:none;}
.gs-item:hover{background:var(--bg2);}
.gs-item-name{font-weight:500;font-size:13px;flex:1;}
.gs-item-sub{font-size:11px;color:var(--text2);margin-top:1px;}
.gs-badge{font-size:10px;font-weight:600;padding:2px 7px;border-radius:20px;flex-shrink:0;white-space:nowrap;}
.gs-badge-sub{background:#0D2B5515;color:var(--navy);}
.gs-badge-rental{background:#0D2B5515;color:var(--navy);}
.gs-empty{padding:1.5rem;text-align:center;color:var(--text2);font-size:13px;}
.gs-item.active{background:var(--bg2);}
.gs-highlight{background:#fff3a0;border-radius:2px;}

/* ══ 상태값 색상 (상태별 서로 다른 배경색) ══ */
.s-contract{background:#0D2B55;color:#fff;font-weight:600;}
.s-alliance{background:#0D2B55;color:#fff;font-weight:600;}
.s-pending{background:#7c3aed;color:#fff;font-weight:600;}
.s-keep{background:#16a34a;color:#fff;font-weight:600;}
.s-meeting2{background:#0e7490;color:#fff;font-weight:600;}
.s-meetnow{background:#0e7490;color:#fff;font-weight:600;}
.s-meeting1{background:#7dd3fc;color:#0c4a6e;font-weight:600;}
.s-meeting{background:#fbbf24;color:#451a03;font-weight:600;}
.s-sent{background:#bef264;color:#365314;font-weight:600;}
.s-absent{background:#9ca3af;color:#111827;font-weight:600;}
.s-lowint{background:#fca5a5;color:#7f1d1d;font-weight:600;}
.s-singlesale{background:#2563eb;color:#fff;font-weight:600;}
.s-legacy{background:#e5e7eb;color:#374151;font-weight:500;}
.status-sel option{background:#fff;color:#1a1a18;}

/* ══ 대시보드 ══ */
.pills{display:flex;border:.5px solid var(--border2);border-radius:var(--r-md);overflow:hidden;width:fit-content;}
.pill{padding:6px 14px;font-size:13px;border:none;background:var(--bg);color:var(--text2);cursor:pointer;font-family:inherit;}
.pill.active{background:var(--navy);color:var(--gold);font-weight:500;}
.pill:not(.active):hover{background:var(--bg2);}
.dcard{background:var(--bg);border:.5px solid var(--border);border-radius:var(--r-lg);padding:1rem 1.1rem;margin-bottom:1rem;}
.dcard h4{font-size:14px;font-weight:600;margin-bottom:.75rem;display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
.dsub{font-size:12px;color:var(--text2);font-weight:400;}
.dtools{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:.75rem;}
.dist-row{display:grid;grid-template-columns:110px 1fr 64px 52px;gap:10px;align-items:center;padding:4px 0;}
.dist-lbl{text-align:center;}
.dist-bar{height:10px;background:var(--bg2);border-radius:5px;overflow:hidden;}
.dist-bar span{display:block;height:100%;}
.dist-n,.dist-p{font-size:12px;text-align:right;font-variant-numeric:tabular-nums;}
.dist-p{color:var(--text2);}
.dtable-wrap{overflow-x:auto;border:.5px solid var(--border);border-radius:var(--r-md);}
table.dtable{min-width:0;width:100%;font-size:12px;}
table.dtable thead th{white-space:nowrap;}
table.dtable td{vertical-align:middle;}
table.dtable td.num,table.dtable th.num{text-align:right;font-variant-numeric:tabular-nums;}
.sbar{display:flex;height:10px;min-width:140px;border-radius:5px;overflow:hidden;background:var(--bg2);}
.sbar span{display:block;height:100%;}
.dlink{font-weight:500;color:var(--navy);cursor:pointer;}
.dlink:hover{text-decoration:underline;}
.dtext{white-space:pre-wrap;word-break:break-word;line-height:1.6;min-width:240px;}
.rc-tag{display:inline-block;font-size:11px;font-weight:600;padding:2px 8px;border-radius:20px;white-space:nowrap;}
.rc-over{background:#fee2e2;color:#991b1b;}
.rc-today{background:#ffedd5;color:#9a3412;}
.rc-soon{background:#fef9c3;color:#854d0b;}
.rc-num{width:64px;padding:4px 6px;font-size:12px;text-align:right;border:.5px solid var(--border2);border-radius:6px;}
.rc-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px;}
.rc-item{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:6px 10px;background:var(--bg2);border-radius:var(--r-md);}
.rep-text{width:100%;min-height:480px;font-size:13px;line-height:1.8;padding:14px 16px;resize:vertical;white-space:pre-wrap;}
.dnote{font-size:12px;color:var(--text2);margin-top:6px;line-height:1.6;}
.dempty{padding:1.5rem;text-align:center;color:var(--text2);font-size:13px;}
</style>
</head>
<body>
<div class="app">

<script>
/* ══ Supabase ══ */
const SB_URL="https://tukmzwfzjftrldegpgny.supabase.co";
const SB_KEY="sb_publishable_R-CLkYtEv3GqgT0jdy7KJQ_A6cQ9Aqe";
const HDR={"Content-Type":"application/json","apikey":SB_KEY,"Authorization":"Bearer "+SB_KEY,"Prefer":"return=representation"};
async function sbGet(t,q=""){const r=await fetch(`${SB_URL}/rest/v1/${t}?${q}`,{headers:HDR});if(!r.ok)throw new Error(await r.text());return r.json();}
async function sbPost(t,b){const r=await fetch(`${SB_URL}/rest/v1/${t}`,{method:"POST",headers:HDR,body:JSON.stringify(b)});if(!r.ok)throw new Error(await r.text());return r.json();}
async function sbPatch(t,id,b){const r=await fetch(`${SB_URL}/rest/v1/${t}?id=eq.${id}`,{method:"PATCH",headers:HDR,body:JSON.stringify(b)});if(!r.ok)throw new Error(await r.text());return r.json();}
async function sbDelete(t,id){const r=await fetch(`${SB_URL}/rest/v1/${t}?id=eq.${id}`,{method:"DELETE",headers:HDR});if(!r.ok)throw new Error(await r.text());}

/* ══ 상태맵 ══ */
const SM_SUB={
  contract:{label:"구독제휴회사",cls:"s-contract"},
  pending:{label:"제휴예정",cls:"s-pending"},
  keep:{label:"관계유지",cls:"s-keep"},
  meeting2:{label:"2차미팅",cls:"s-meeting2"},
  meeting1:{label:"1차미팅",cls:"s-meeting1"},
  meeting:{label:"미팅예정",cls:"s-meeting"},
  sent:{label:"자료발송",cls:"s-sent"},
  absent:{label:"부재",cls:"s-absent"},
  lowint:{label:"관심낮음",cls:"s-lowint"}
};
const SM_RENTAL={
  alliance:{label:"포괄제휴",cls:"s-alliance"},
  singlesale:{label:"건별매매",cls:"s-singlesale"},
  pending:{label:"제휴예정",cls:"s-pending"},
  keep:{label:"관계유지",cls:"s-keep"},
  meetnow:{label:"미팅",cls:"s-meetnow"},
  meeting:{label:"미팅예정",cls:"s-meeting"},
  sent:{label:"자료발송",cls:"s-sent"},
  absent:{label:"부재",cls:"s-absent"},
  lowint:{label:"관심낮음",cls:"s-lowint"}
};
const TM={
  visit:{label:"방문 미팅",cls:"type-visit",icon:"ti-building"},
  call:{label:"유선 통화",cls:"type-call",icon:"ti-phone"},
  email:{label:"이메일",cls:"type-email",icon:"ti-mail"},
  other:{label:"기타",cls:"type-other",icon:"ti-dots"}
};
const ORDER_SUB={contract:0,pending:1,keep:2,meeting2:3,meeting1:4,meeting:5,sent:6,absent:7,lowint:8};
const ORDER_RENTAL={alliance:0,singlesale:1,pending:2,keep:3,meetnow:4,meeting:5,sent:6,absent:7,lowint:8};

/* ══ 월 컬럼 자동계산 ══ */
// DB 컬럼: m1~m12 (월 번호), 당월+직전2개월 표시
function getMonthCols(){
  const now=new Date();
  const cols=[];
  for(let i=2;i>=0;i--){
    let y=now.getFullYear(),m=now.getMonth()+1-i;
    if(m<=0){m+=12;y--;}
    const key="m"+m;
    const label=y+"년 "+m+"월";
    cols.push({key,label,m,y});
  }
  return cols; // [2개월전, 1개월전, 당월]
}
const MONTH_COLS=getMonthCols();

/* ══ 전역 상태 ══ */
let allCompanies=[]; // 전체 (page:'sub'|'rental' 필드)
let editId=null;
let panelId=null;
let currentPage='sub'; // 현재 페이지
let editCtId=null;
let tabState={sub:'company',rental:'company'};
let modalPage='sub';

function subCos(){return allCompanies.filter(c=>c.page==='sub');}
function rentalCos(){return allCompanies.filter(c=>c.page==='rental');}
function getCos(page){return page==='sub'?subCos():rentalCos();}
function getSM(page){return page==='sub'?SM_SUB:SM_RENTAL;}
function getOrder(page){return page==='sub'?ORDER_SUB:ORDER_RENTAL;}

/* ══ 유틸 ══ */
function parseAmt(s){return parseInt((s||"").toString().replace(/[^0-9]/g,""),10)||0;}
function fmtAmt(n){return n?Number(n).toLocaleString("ko-KR"):"";}
function fmtInput(el){const r=el.value.replace(/[^0-9]/g,"");el.value=r?Number(r).toLocaleString("ko-KR"):"";}
function escH(s){return(s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}
function lastContact(c){if(!(c.contacts&&c.contacts.length))return null;return c.contacts.slice().sort((a,b)=>b.date.localeCompare(a.date))[0];}
function calcTotal(c){return MONTH_COLS.reduce((s,col)=>s+(c[col.key]||0),0);}

let toastTimer;
function toast(msg,err=false){
  const el=document.getElementById("toast");
  el.textContent=msg;el.className="toast"+(err?" err":"")+" show";
  clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove("show"),2500);
}
function loading(show,msg="저장 중..."){
  document.getElementById("loadingOverlay").classList.toggle("show",show);
  document.getElementById("loadingMsg").textContent=msg;
}

/* ══ 테이블 헤더 월 라벨 초기화 ══ */
function initMonthHeaders(){
  MONTH_COLS.forEach((col,i)=>{
    ["sub","rental"].forEach(p=>{
      const th=document.getElementById(`th-${p}-m${i}`);
      if(th) th.textContent=col.label;
    });
    // 모달 라벨
    const fl=document.getElementById("fl-m"+i);
    if(fl) fl.textContent=col.label;
  });
}

/* ══ 데이터 로드 ══ */
async function loadAll(){
  loading(true,"데이터 불러오는 중...");
  try{
    const [cos,cts]=await Promise.all([
      sbGetAll("companies","order=created_at.asc,id.asc"),
      sbGetAll("contacts","order=id.asc")
    ]);
    // page 필드 없는 기존 데이터: status='rental'이면 rental, 아니면 sub
    allCompanies=cos.map(c=>({
      ...c,
      page: c.page || (c.status==='rental'?'rental':'sub'),
      // rental 페이지로 이관된 업체의 status 보정
      status: (c.page==='rental'||(!c.page&&c.status==='rental'))
        ? (c.status==='rental'?'existing':c.status)
        : c.status,
      contacts:cts.filter(ct=>ct.company_id===c.id)
    }));
    await loadExtras();
    renderAll();
  }catch(e){toast("데이터 로드 실패: "+e.message,true);}
  finally{loading(false);}
}

function renderAll(){
  fillFilters();
  renderTable('sub');
  renderTable('rental');
  updateStats('sub');
  updateStats('rental');
}

/* ══ 통계 ══ */
function updateStats(page){
  const cos=getCos(page);
  const sm=getSM(page);
  let tot=0;
  const counts={};
  Object.keys(sm).forEach(k=>counts[k]=0);
  cos.forEach(c=>{if(counts[c.status]!==undefined)counts[c.status]++;tot+=calcTotal(c);});
  const topStatus=Object.entries(sm).slice(0,3);
  document.getElementById("stats-"+page).innerHTML=`
    <div class="stat"><div class="stat-label">전체 업체</div><div class="stat-value">${cos.length}</div></div>
    ${topStatus.map(([k,v])=>`<div class="stat"><div class="stat-label">${v.label}</div><div class="stat-value">${counts[k]||0}</div></div>`).join("")}
    <div class="stat"><div class="stat-label">전체 취급총액</div><div class="stat-value" style="font-size:15px;color:var(--navy);">${tot?tot.toLocaleString("ko-KR"):"-"}</div></div>
  `;
}

/* ══ 테이블 렌더 ══ */
function renderTable(page){
  const q=(document.getElementById("search-"+page)||{value:""}).value.toLowerCase();
  const fs=(document.getElementById("filter-"+page)||{value:""}).value;
  const sm=getSM(page);
  const order=getOrder(page);
  const isRental=page==='rental';

  let filtered=getCos(page).filter(c=>
    (!q||c.name.toLowerCase().includes(q)||(c.contact||"").toLowerCase().includes(q))&&
    (!fs||c.status===fs)
  );
  filtered.sort((a,b)=>{
    const sa=order[a.status]??99,sb=order[b.status]??99;
    if(sa!==sb)return sa-sb;
    const la=lastContact(a)?lastContact(a).date:'0000-00-00';
    const lb=lastContact(b)?lastContact(b).date:'0000-00-00';
    return lb.localeCompare(la);
  });

  updateStats(page);
  const tbody=document.getElementById("tbody-"+page);
  const empty=document.getElementById("empty-"+page);
  empty.style.display=filtered.length===0?"block":"none";
  if(!filtered.length){tbody.innerHTML="";return;}

  const amtClass=isRental?"td-amt rental":"td-amt";
  const totClass=isRental?"td-amt-total rental":"td-amt-total";
  const nameClass=isRental?"name-link rental":"name-link";
  const targetPage=isRental?'sub':'rental';
  const transferLabel=isRental?'구독으로 이관':'렌탈로 이관';

  tbody.innerHTML=filtered.map(c=>{
    const lc=lastContact(c);
    const s=statusInfo(page,c.status);
    const total=calcTotal(c);
    const cnt=(c.contacts||[]).length;
    return `<tr>
      <td>
        <span class="${nameClass}" onclick="openPanel(${c.id})">${escH(c.name)}</span>
        ${cnt>0?`<span class="cnt-badge">(${cnt}건)</span>`:""}
        ${c.address?`<div style="font-size:11px;color:var(--text3);margin-top:2px;">${escH(c.address)}</div>`:""}
      </td>
      <td class="td-sub">${escH(c.product||"-")}</td>
      <td>${escH(c.contact||"-")}</td>
      <td class="td-sub" style="white-space:nowrap;">${escH(c.phone||"-")}</td>
      <td class="${totClass}" id="tot-${c.id}">${fmtAmt(total)||"-"}</td>
      ${[...MONTH_COLS].reverse().map(col=>`<td class="${amtClass}">${amtCell(c.id,col.key,c[col.key])}</td>`).join("")}
      <td class="td-sub" style="white-space:nowrap;">${lc?lc.date:"-"}</td>
      <td>
        <select class="status-sel ${s.cls}" onchange="chgStatus(${c.id},this.value,'${page}')">
          ${statusOptionsHtml(page,c.status)}
        </select>
      </td>
      <td style="white-space:nowrap;"><div style="display:flex;gap:3px;flex-wrap:nowrap;">
        <button class="btn-sm" onclick="openEdit(${c.id})"><i class="ti ti-edit"></i></button>
        <button class="btn-transfer" onclick="transferCo(${c.id},'${targetPage}')" title="${transferLabel}"><i class="ti ti-arrows-exchange" style="font-size:11px;"></i></button>
        <button class="btn-danger" onclick="delCo(${c.id})"><i class="ti ti-trash"></i></button>
      </div></td>
    </tr>`;
  }).join("");
}

function amtCell(id,field,val){
  const v=fmtAmt(val);
  return `<input class="amt-input" data-id="${id}" data-field="${field}" value="${v}" placeholder="-"
    onfocus="this.value=this.value.replace(/,/g,'')"
    onblur="saveAmt(this)" oninput="this.value=this.value.replace(/[^0-9]/g,'')"/>`;
}
async function saveAmt(el){
  const id=Number(el.dataset.id),field=el.dataset.field,raw=parseAmt(el.value);

  catch(e){toast("저장 실패: "+e.message,true);}

/* ══ 업체 이관 ══ */
// 상태값 자동 변환 매핑
const STATUS_MAP_TO_RENTAL={contract:"alliance",pending:"singlesale",meeting1:"meetnow",meeting2:"meetnow"};
const STATUS_MAP_TO_SUB={alliance:"contract",singlesale:"pending",meetnow:"meeting1"};

function mapStatus(status, targetPage){
  const map=targetPage==='rental'?STATUS_MAP_TO_RENTAL:STATUS_MAP_TO_SUB;
  return map[status]||status;
}

async function transferCo(id,targetPage){
  const c=allCompanies.find(x=>x.id===id);if(!c)return;
  const fromLabel=c.page==='sub'?'구독':'렌탈';
  const toLabel=targetPage==='sub'?'구독':'렌탈';
  if(!confirm(`[${c.name}]을 ${fromLabel} → ${toLabel} 영업관리로 이관하시겠습니까?\n(상태값은 아래 기준으로 자동 변환됩니다)\n\n구독제휴회사 ↔ 포괄제휴\n제휴예정 ↔ 건별매매\n1·2차미팅 ↔ 미팅\n그 외 상태값 및 컨택이력 내용은 유지`))return;
  loading(true,"이관 중...");
  const fromPage=c.page;

  // 업체 상태값 변환
  const newStatus=mapStatus(c.status, targetPage);

  // 컨택이력 상태값도 동일 기준 변환
  const updatedContacts=(c.contacts||[]).map(ct=>({
    ...ct,
    status: mapStatus(ct.status, targetPage)
  }));

  try{
    // 업체 page + status 업데이트
    await sbPatch("companies",id,{page:targetPage,status:newStatus});
    c.page=targetPage;
    c.status=newStatus;

    // 컨택이력 상태값 일괄 업데이트
    await Promise.all(
      updatedContacts
        .filter((ct,i)=>ct.status !== (c.contacts||[])[i]?.status)
        .map(ct=>sbPatch("contacts",ct.id,{status:ct.status}))
    );
    c.contacts=updatedContacts;

    renderTable(fromPage);renderTable(targetPage);
    toast(`${toLabel} 영업관리로 이관됐습니다`);
  }catch(e){toast("이관 실패: "+e.message,true);}
  finally{loading(false);}
}

async function saveCompany(){
  const name=document.getElementById("f-name").value.trim();
  if(!name){alert("업체명을 입력해주세요.");return;}
  const payload={
    name,
    product:document.getElementById("f-product").value.trim(),
    contact:document.getElementById("f-contact").value.trim(),
    phone:document.getElementById("f-phone").value.trim(),
    address:document.getElementById("f-address").value.trim(),
    status:document.getElementById("f-status").value,
    page:modalPage
  };
  // 월별 취급액은 별도로 저장 (스키마 캐시 문제 방지)
  const monthPayload={};
  MONTH_COLS.forEach((col,i)=>{monthPayload[col.key]=parseAmt(document.getElementById("f-m"+i).value);});
  loading(true,"저장 중...");
  try{
    if(editId){
      const [updated]=await sbPatch("companies",editId,{...payload,...monthPayload});
      const idx=allCompanies.findIndex(x=>x.id===editId);
      if(idx>=0)allCompanies[idx]={...allCompanies[idx],...updated,...monthPayload};
      toast("업체 정보가 수정됐습니다");
    }else{
      // 1단계: 기본 정보 저장
      const [created]=await sbPost("companies",payload);
      // 2단계: 월별 취급액 별도 patch
      const mVals=Object.values(monthPayload);
      if(mVals.some(v=>v>0)){
        await sbPatch("companies",created.id,monthPayload);
      }
      allCompanies.push({...created,...monthPayload,contacts:[]});
      toast("업체가 추가됐습니다");
    }
    renderTable(modalPage);closeModal();
  }catch(e){toast("저장 실패: "+e.message,true);}
  finally{loading(false);}
}

  const coRows=cos.map(c=>{

      sm[c.status]?sm[c.status].label:c.status,

  });

  if (idx < 0) return escH(text);
  return escH(text.slice(0, idx))
    + '<mark class="gs-highlight">' + escH(text.slice(idx, idx + q.length)) + '</mark>'
    + escH(text.slice(idx + q.length));
}

function gsSelect(id, page) {
  gsClose();
  switchPage(page);
  // 해당 페이지 업체별 탭으로 전환
  if (tabState[page] !== 'company') switchTab(page, 'company');

  setTimeout(() => openPanel(id), 50);
}

function gsClose() {
  document.getElementById('gsDropdown').classList.remove('show');
  document.getElementById('gsInput').value = '';
  gsIndex = -1;
}

function gsKeydown(e) {
  const dd = document.getElementById('gsDropdown');
  const items = dd.querySelectorAll('.gs-item');
  if (!items.length) return;
  if (e.key === 'ArrowDown') {
    e.preventDefault();
    gsIndex = Math.min(gsIndex + 1, items.length - 1);
    items.forEach((el, i) => el.classList.toggle('active', i === gsIndex));
    items[gsIndex] && items[gsIndex].scrollIntoView({block:'nearest'});
  } else if (e.key === 'ArrowUp') {
    e.preventDefault();
    gsIndex = Math.max(gsIndex - 1, 0);
    items.forEach((el, i) => el.classList.toggle('active', i === gsIndex));
    items[gsIndex] && items[gsIndex].scrollIntoView({block:'nearest'});
  } else if (e.key === 'Enter' && gsIndex >= 0) {
    items[gsIndex] && items[gsIndex].click();
  } else if (e.key === 'Escape') {
    gsClose();
  }
}

// 검색창 외부 클릭 시 닫기

});

/* ── 전체 페이지 조회 (1,000건 초과 대비) ── */
async function sbGetAll(t,q=""){
  const out=[],size=1000;
  for(let off=0;;off+=size){
    const rows=await sbGet(t,`${q}${q?"&":""}limit=${size}&offset=${off}`);
    out.push(...rows);
    if(rows.length<size)break;
  }
  return out;
}

/* ── 날짜 유틸 ── */
function pad2(n){return String(n).padStart(2,"0");}
function ymd(d){return d.getFullYear()+"-"+pad2(d.getMonth()+1)+"-"+pad2(d.getDate());}
function todayStr(){return ymd(new Date());}
function parseYmd(s){const a=String(s).slice(0,10).split("-").map(Number);return new Date(a[0],a[1]-1,a[2]);}
function addDays(s,n){const d=parseYmd(s);d.setDate(d.getDate()+n);return ymd(d);}
function diffDays(a,b){return Math.round((parseYmd(a)-parseYmd(b))/86400000);}
function weekStartStr(s){const d=parseYmd(s);d.setDate(d.getDate()-((d.getDay()+6)%7));return ymd(d);}
const DOW=["일","월","화","수","목","금","토"];
function fmtKDate(s){return s+"("+DOW[parseYmd(s).getDay()]+")";}
function periodKey(s,g){return g==="day"?s:g==="week"?weekStartStr(s):s.slice(0,7);}
function periodLabel(k,g){
  if(g==="day")return k.slice(5);
  if(g==="month")return k.slice(0,4)+"년 "+Number(k.slice(5))+"월";
  return k.slice(5)+" ~ "+addDays(k,6).slice(5);
}

/* ── 상태값 헬퍼 : 기존 상태값은 변경하지 않고 그대로 표시 ── */
const LEGACY_LABELS={existing:"기거래",positive:"긍정적",neutral:"중립",negative:"부정적",initial:"초기 컨택",followup:"팔로업 필요",rental:"렌탈",vpositive:"매우 긍정적",affiliate:"제휴회사"};
function statusInfo(page,key){
  const sm=getSM(page);
  if(sm[key])return sm[key];
  const other=page==="sub"?SM_RENTAL:SM_SUB;
  if(other[key])return other[key];
  const lg=LEGACY_LABELS[key];
  return {label:lg?lg+" (기존)":(key||"-"),cls:"s-legacy"};
}
function statusLabel(page,key){return statusInfo(page,key).label;}
function statusOptionsHtml(page,cur){
  const sm=getSM(page);
  let h=Object.entries(sm).map(([v,m])=>`<option value="${v}" ${cur===v?"selected":""}>${m.label}</option>`).join("");
  if(cur&&!sm[cur])h+=`<option value="${cur}" selected>${statusInfo(page,cur).label}</option>`;
  return h;
}
function extraStatusKeys(page,keysInUse){
  const sm=getSM(page),out=[];
  keysInUse.forEach(k=>{if(k&&!sm[k]&&!out.includes(k))out.push(k);});
  return out;
}
function statusRank(p,s){const o=p==="sub"?ORDER_SUB:ORDER_RENTAL;return o[s]!==undefined?o[s]:99;}
function fillFilters(){

}

/* ── 상태 변경 이력 (status_history 테이블 + 컨택이력에서 재구성) ── */
let statusHist=[],histMap=null,histWarned=false;
function histFor(id){
  if(!histMap){histMap={};statusHist.forEach(h=>{(histMap[h.company_id]=histMap[h.company_id]||[]).push(h);});}
  return histMap[id]||[];
}
async function logStatusChange(c,from,to,source){
  if(!from||from===to)return;
  try{
    const rows=await sbPost("status_history",{company_id:c.id,from_status:from,to_status:to,changed_date:todayStr(),source:source||"manual"});
    if(rows&&rows[0]){statusHist.push(rows[0]);histMap=null;}
  }catch(e){
    if(!histWarned){histWarned=true;toast("상태 변경이력 테이블이 없어 직접 변경일이 저장되지 않았습니다 (SQL 실행 필요)",true);}
  }
}
function companyEvents(c){
  const pts=[];
  (c.contacts||[]).forEach(ct=>{if(ct.status&&ct.date)pts.push({date:ct.date,status:ct.status,src:"contact",ord:Number(ct.id)||0});});
  histFor(c.id).forEach(h=>{pts.push({date:h.changed_date||String(h.changed_at||"").slice(0,10),status:h.to_status,src:h.source||"manual",ord:1e15+(Number(h.id)||0)});});
  pts.sort((a,b)=>a.date.localeCompare(b.date)||a.ord-b.ord);
  return pts;
}
function statusTimeline(c){
  const tl=[];
  companyEvents(c).forEach(p=>{
    const last=tl[tl.length-1];
    if(!last||last.status!==p.status)tl.push({date:p.date,status:p.status,from:last?last.status:null,src:p.src});
  });
  const created=String(c.created_at||"").slice(0,10);
  if(!tl.length)tl.push({date:created||todayStr(),status:c.status,from:null,src:"base"});
  else if(tl[tl.length-1].status!==c.status)tl.push({date:todayStr(),status:c.status,from:tl[tl.length-1].status,src:"sync"});
  let start=tl[0].date;
  if(created&&created<start)start=created;
  return {tl,start};
}
function statusAt(t,date){
  if(date<t.start)return null;
  let s=t.tl[0].status;
  for(const e of t.tl){if(e.date<=date)s=e.status;else break;}
  return s;
}

function setRecontactDays(p,s,val){recontactCfg[p][s]=val===""?0:Math.max(0,parseInt(val,10)||0);}

function recontactRows(pages){
  const today=todayStr(),rows=[];
  pages.forEach(p=>getCos(p).forEach(c=>{
    const days=getInterval(p,c.status);
    if(!(days>0))return;
    const lc=lastContact(c);
    const base=lc?lc.date:(String(c.created_at||"").slice(0,10)||today);
    const elapsed=diffDays(today,base);
    rows.push({p,c,lc,base,days,elapsed,over:elapsed-days,due:addDays(base,days)});
  }));
  return rows;
}

/* ── ① 상태 현황 · 변화 추이 · 변경 이력 ── */
function distBlock(p){
  const cos=getCos(p),total=cos.length;
  const cnt={};cos.forEach(c=>{cnt[c.status]=(cnt[c.status]||0)+1;});
  const keys=Object.keys(getSM(p)).concat(extraStatusKeys(p,cos.map(c=>c.status)));
  const rows=keys.map(k=>{
    const si=statusInfo(p,k),n=cnt[k]||0,pct=total?n/total*100:0;
    return `<div class="dist-row"><span class="status-badge ${si.cls} dist-lbl">${si.label}</span><div class="dist-bar"><span class="${si.cls}" style="width:${pct}%"></span></div><span class="dist-n">${n}개사</span><span class="dist-p">${pct.toFixed(1)}%</span></div>`;
  }).join("");
  return `<div class="dcard"><h4>${pageBadge(p)} 상태값별 업체 현황 <span class="dsub">전체 ${total}개사 기준</span></h4>${total?rows:'<div class="dempty">등록된 업체가 없습니다</div>'}</div>`;
}
function trendPeriods(g,n){
  const today=todayStr(),out=[];
  if(g==="day"){for(let i=n-1;i>=0;i--){const d=addDays(today,-i);out.push({label:periodLabel(d,"day"),end:d});}}
  else if(g==="week"){const ws=weekStartStr(today);for(let i=n-1;i>=0;i--){const s=addDays(ws,-7*i),e=addDays(s,6);out.push({label:periodLabel(s,"week"),end:e>today?today:e});}}
  else{
    const d=parseYmd(today);
    for(let i=n-1;i>=0;i--){
      const m=new Date(d.getFullYear(),d.getMonth()-i,1);
      const k=m.getFullYear()+"-"+pad2(m.getMonth()+1);
      const e=ymd(new Date(m.getFullYear(),m.getMonth()+1,0));
      out.push({label:periodLabel(k,"month"),end:e>today?today:e});
    }
  }
  return out;
}
function trendBlock(p){
  const cos=getCos(p);
  const n=dash.trendGran==="day"?14:dash.trendGran==="week"?8:6;
  const periods=trendPeriods(dash.trendGran,n);
  const tls=cos.map(c=>statusTimeline(c));
  const used=[];tls.forEach(t=>t.tl.forEach(e=>used.push(e.status)));
  const keys=Object.keys(getSM(p)).concat(extraStatusKeys(p,used));
  const rows=periods.map(per=>{
    const cnt={};let tot=0;
    tls.forEach(t=>{const s=statusAt(t,per.end);if(s){cnt[s]=(cnt[s]||0)+1;tot++;}});
    const bar=keys.map(k=>cnt[k]?`<span class="${statusInfo(p,k).cls}" style="width:${cnt[k]/tot*100}%" title="${statusLabel(p,k)} ${cnt[k]}"></span>`:"").join("");
    return `<tr><td style="white-space:nowrap;">${per.label}</td><td class="num"><b>${tot}</b></td>${keys.map(k=>`<td class="num">${cnt[k]||"-"}</td>`).join("")}<td><div class="sbar">${bar}</div></td></tr>`;
  }).reverse().join("");
  const head=`<tr><th>기간(말일 기준)</th><th class="num">전체</th>${keys.map(k=>`<th class="num"><span class="status-badge ${statusInfo(p,k).cls}">${statusLabel(p,k)}</span></th>`).join("")}<th>구성</th></tr>`;
  return `<div class="dcard"><h4>${pageBadge(p)} 상태값 변화 추이 <span class="dsub">컨택이력·변경이력으로 재구성한 기간 말일 기준 업체 수</span></h4>
    <div class="dtools">${granPills(dash.trendGran,"setTrendGran")}</div>
    <div class="dtable-wrap"><table class="dtable"><thead>${head}</thead><tbody>${rows}</tbody></table></div></div>`;
}
function histBlock(){
  return `<div class="dcard"><h4>업체별 상태값 변경 이력 <span class="dsub">누적 · 최신순</span></h4>
    <div class="dtools"><input type="text" id="hist-q" placeholder="업체명 검색..." value="${escH(dash.histQ)}" oninput="dash.histQ=this.value;renderHistList()" style="min-width:220px;"/></div>
    <div id="hist-list"></div></div>`;
}
function renderHistList(){
  const box=document.getElementById("hist-list");if(!box)return;
  const q=(dash.histQ||"").trim().toLowerCase();
  let ev=[];
  dashPages().forEach(p=>getCos(p).forEach(c=>{
    if(q&&!c.name.toLowerCase().includes(q))return;
    statusTimeline(c).tl.forEach(e=>{
      if(e.from&&e.src!=="sync"&&e.src!=="base")ev.push({date:e.date,p,c,from:e.from,to:e.status,src:e.src});
    });
  }));
  ev.sort((a,b)=>b.date.localeCompare(a.date)||a.c.name.localeCompare(b.c.name));
  if(!ev.length){box.innerHTML='<div class="dempty">변경 이력이 없습니다</div>';return;}
  const total=ev.length;ev=ev.slice(0,200);
  const srcL={contact:"컨택이력",manual:"직접변경"};

/* ── ② 일자별 영업활동 현황 ── */
function setActRange(kind){
  const t=todayStr();
  if(kind==="today"){dash.from=t;dash.to=t;}
  else if(kind==="week"){dash.from=weekStartStr(t);dash.to=t;}
  else if(kind==="month"){dash.from=t.slice(0,8)+"01";dash.to=t;}
  else if(kind==="7d"){dash.from=addDays(t,-6);dash.to=t;}
  else if(kind==="30d"){dash.from=addDays(t,-29);dash.to=t;}
  renderDash();
}
function collectContacts(pages,from,to){
  const out=[];
  pages.forEach(p=>getCos(p).forEach(c=>(c.contacts||[]).forEach(ct=>{if(ct.date>=from&&ct.date<=to)out.push({p,c,ct});})));
  out.sort((a,b)=>b.ct.date.localeCompare(a.ct.date)||a.c.name.localeCompare(b.c.name));
  return out;
}
function sectorOf(c){const t=(c.product||"").split(/[,，、\/·]/)[0].trim();return t||"기타(품목 미기재)";}
function productTokens(c){return(c.product||"").split(/[,，、\/·]/).map(s=>s.trim()).filter(Boolean);}

/* ══ ④⑤ Daily / Weekly 보고서 ══ */
const POS_STATUS=["contract","alliance","pending","singlesale","meeting2","meeting1","meetnow","meeting"];
const NEG_STATUS=["absent","lowint"];
const FU_KEYS=["예정","요청","회신","발송","송부","준비","재연락","재컨택","미팅","방문","협의","검토","확인 후","진행 여부"];
const STATUS_ACTION={
  contract:"구독 제휴 운영 현황 점검 및 신규 건 발굴",alliance:"포괄제휴 운영 현황 점검 및 신규 건 발굴",
  pending:"제휴 조건 협의 및 계약 일정 조율",singlesale:"건별 매매 건 진행 상황 확인",
  meeting2:"2차 미팅 결과 정리 및 제휴 조건 협의",meeting1:"1차 미팅 결과 공유 및 2차 미팅 일정 협의",meetnow:"미팅 결과 정리 및 후속 협의",
  meeting:"미팅 일정 확정 및 준비",sent:"자료 검토 여부 확인 및 회신 팔로업",keep:"정기 접촉을 통한 관계 유지",
  absent:"재통화 시도(담당자 연결)",lowint:"장기 주기로 재컨택 관리"
};
const FU_ORDER=["pending","singlesale","meeting2","meetnow","meeting1","meeting","sent","contract","alliance","keep","absent","lowint"];
function fuRank(s){const i=FU_ORDER.indexOf(s);return i<0?99:i;}
function uniq(a){return a.filter((x,i)=>a.indexOf(x)===i);}
function oneLine(t,n){const s=String(t||"").replace(/\s+/g," ").trim();return s.length>n?s.slice(0,n)+"…":s;}
function splitSentences(t){return String(t||"").split(/\n+|[.。]\s+/).map(s=>s.trim().replace(/[.。]$/,"")).filter(Boolean);}
function brief(t,n){return oneLine(splitSentences(t).join(", "),n);}
function followUpOf(status,texts){
  const latest=texts.length?texts[texts.length-1]:"";
  const hits=splitSentences(latest).filter(s=>FU_KEYS.some(k=>s.includes(k)));
  if(hits.length)return oneLine(hits[hits.length-1],70);
  return STATUS_ACTION[status]||"";
}
function statusCountText(items,get){
  const g=get||(x=>x.c.status),m=new Map();
  items.slice().sort((a,b)=>statusRank(a.page,g(a))-statusRank(b.page,g(b))).forEach(x=>{const l=statusLabel(x.page,g(x));m.set(l,(m.get(l)||0)+1);});
  return [...m.entries()].map(([l,n])=>`${l} ${n}개사`).join(", ");
}
function typeCountText(items){
  const t={};items.forEach(x=>x.cts.forEach(ct=>{t[ct.type]=(t[ct.type]||0)+1;}));
  return Object.keys(TM).filter(k=>t[k]).map(k=>`${TM[k].label} ${t[k]}건`).join(", ");
}
function groupBySector(items){
  const g={};items.forEach(x=>{const k=sectorOf(x.c);(g[k]=g[k]||[]).push(x);});
  return Object.entries(g).sort((a,b)=>b[1].length-a[1].length);
}
function reportScope(scope){
  const pages=scope==="all"?["sub","rental"]:[scope];
  const name=scope==="sub"?"구독":scope==="rental"?"렌탈":"구독·렌탈 통합";
  const tag=p=>scope==="all"?`[${pageName(p)}]`:"";
  return {pages,name,tag};
}
function buildDailyReport(scope,date){
  const {pages,name,tag}=reportScope(scope);
  const items=[];
  pages.forEach(p=>getCos(p).forEach(c=>{
    const cts=(c.contacts||[]).filter(ct=>ct.date===date).sort((a,b)=>(Number(a.id)||0)-(Number(b.id)||0));
    if(cts.length)items.push({c,page:p,cts});
  }));
  const title=`[${name} 영업관리 Daily 영업활동 보고] ${fmtKDate(date)}`;
  if(!items.length)return title+"\n\n해당 일자에 등록된 컨택 이력이 없습니다.";
  const totalCts=items.reduce((s,x)=>s+x.cts.length,0);
  const gArr=groupBySector(items);
  const prods=uniq([].concat(...items.map(x=>productTokens(x.c))));
  const split=scope==="all"?` (구독 ${items.filter(x=>x.page==="sub").length}개사, 렌탈 ${items.filter(x=>x.page==="rental").length}개사)`:"";
  const p1=`${fmtKDate(date)} 컨택한 업체는 총 ${items.length}개사${split}, 컨택 ${totalCts}건(${typeCountText(items)})입니다. 취급품목·사업 분야는 ${gArr.map(([k,l])=>`${k} ${l.length}개사`).join(", ")} 순이며${prods.length?`, 주요 취급품목은 ${prods.slice(0,8).join(", ")}${prods.length>8?" 등":""}입니다`:""}.`;
  const secs=gArr.slice(0,6).map(([k,list])=>{
    const shown=list.slice(0,4).map(x=>`${tag(x.page)}${x.c.name}(${statusLabel(x.page,x.c.status)}) - ${uniq(x.cts.map(ct=>brief(ct.text,60)).filter(Boolean)).join(" / ")||"내용 미기재"}`);
    return `${k} 분야(${list.length}개사)에서는 ${shown.join(", ")}${list.length>4?` 외 ${list.length-4}개사`:""} 등 협의가 이루어졌습니다.`;
  });
  const restN=gArr.slice(6).reduce((s,[,l])=>s+l.length,0);
  const p2=`취급품목·업종별 주요 협의 내용은 다음과 같습니다. ${secs.join(" ")}${restN?` 그 외 분야 ${restN}개사도 컨택하였습니다.`:""}`;
  const fu=items.slice().sort((a,b)=>fuRank(a.c.status)-fuRank(b.c.status)).map(x=>({n:`${tag(x.page)}${x.c.name}`,act:followUpOf(x.c.status,x.cts.map(ct=>ct.text))})).filter(f=>f.act).slice(0,6);
  const absentN=items.filter(x=>x.c.status==="absent").length;
  const p3=`컨택 업체의 현재 영업 단계는 ${statusCountText(items)}입니다. 향후 후속 조치는 ${fu.length?fu.map(f=>`${f.n}(${f.act})`).join(", ")+" 순으로":"업체별 반응에 따라 순차적으로"} 진행할 예정입니다.${absentN?` 부재 ${absentN}개사는 재통화를 시도할 계획입니다.`:""}`;
  return [title,"",p1,"",p2,"",p3].join("\n");
}
function weekSummary(x,tag){
  const labels=uniq(x.cts.map(ct=>statusLabel(x.page,ct.status)));
  const path=labels.length>1?labels.join(" → "):labels[0];
  const last=brief(x.cts[x.cts.length-1].text,80)||"내용 미기재";
  return `${tag(x.page)}${x.c.name}[${path}${x.cts.length>1?`, 주 ${x.cts.length}회 컨택`:""}] 최종 협의: ${last}`;
}
function buildWeeklyReport(scope,anyDate){
  const ws=weekStartStr(anyDate),we=addDays(ws,6);
  const {pages,name,tag}=reportScope(scope);
  const items=[];
  pages.forEach(p=>getCos(p).forEach(c=>{
    const cts=(c.contacts||[]).filter(ct=>ct.date>=ws&&ct.date<=we).sort((a,b)=>a.date.localeCompare(b.date)||(Number(a.id)||0)-(Number(b.id)||0));
    if(cts.length)items.push({c,page:p,cts,fs:cts[cts.length-1].status});
  }));
  const title=`[${name} 영업관리 Weekly 영업활동 보고] ${ws} ~ ${we}`;
  if(!items.length)return title+"\n\n해당 주간에 등록된 컨택 이력이 없습니다.";
  const totalCts=items.reduce((s,x)=>s+x.cts.length,0);
  const dayCnt={};items.forEach(x=>x.cts.forEach(ct=>{dayCnt[ct.date]=(dayCnt[ct.date]||0)+1;}));
  const peak=Object.entries(dayCnt).sort((a,b)=>b[1]-a[1]||a[0].localeCompare(b[0]))[0];
  const multi=items.filter(x=>x.cts.length>1).length;
  const gArr=groupBySector(items);
  const prods=uniq([].concat(...items.map(x=>productTokens(x.c))));
  const split=scope==="all"?` (구독 ${items.filter(x=>x.page==="sub").length}개사, 렌탈 ${items.filter(x=>x.page==="rental").length}개사)`:"";
  const s1=`${ws} ~ ${we} 주간 컨택한 업체는 총 ${items.length}개사${split}, 컨택 ${totalCts}건(${typeCountText(items)})입니다.${peak?` 일자별로는 ${fmtKDate(peak[0])}에 ${peak[1]}건으로 가장 활발했습니다.`:""}${multi?` 이 중 ${multi}개사는 주중 2회 이상 컨택하여 진행 경과와 최종 협의 결과 중심으로 통합 정리하였습니다.`:""} 주간 컨택 종료 시점 기준 영업 단계는 ${statusCountText(items,x=>x.fs)}입니다.`;
  const s2=`컨택 업체의 주요 사업 분야는 ${gArr.map(([k,l])=>`${k} ${l.length}개사`).join(", ")} 순입니다.${prods.length?` 주요 취급품목은 ${prods.slice(0,10).join(", ")}${prods.length>10?" 등":""}입니다.`:""}`;
  const s3=gArr.slice(0,6).map(([k,list])=>{
    const pos=list.filter(x=>POS_STATUS.includes(x.fs)).length,neg=list.filter(x=>NEG_STATUS.includes(x.fs)).length,mid=list.length-pos-neg;
    return `■ ${k}(${list.length}개사): 업체 반응은 제휴·미팅 진전 ${pos}개사, 자료발송·관계유지 ${mid}개사, 부재·관심낮음 ${neg}개사입니다. ${list.slice(0,3).map(x=>weekSummary(x,tag)).join(" / ")}${list.length>3?` 외 ${list.length-3}개사`:""}`;
  });
  const restN=gArr.slice(6).reduce((s,[,l])=>s+l.length,0);
  if(restN)s3.push(`■ 그 외 분야 ${restN}개사도 컨택하였습니다.`);
  const newAff=[];
  pages.forEach(p=>getCos(p).forEach(c=>{
    statusTimeline(c).tl.forEach(e=>{
      if(e.from&&e.src!=="sync"&&e.src!=="base"&&e.date>=ws&&e.date<=we&&(e.status==="contract"||e.status==="alliance"))newAff.push(`${tag(p)}${c.name}(${statusLabel(p,e.status)} 전환, ${e.date.slice(5)})`);
    });
  }));
  const avail=items.filter(x=>["contract","alliance","pending","singlesale"].includes(x.fs)).map(x=>`${tag(x.page)}${x.c.name}(${statusLabel(x.page,x.fs)})`);
  const s4=`${newAff.length?`해당 주간 신규 제휴 전환 업체는 ${newAff.join(", ")}입니다.`:"해당 주간 신규 제휴 전환 업체는 없었습니다."} 구독·렌탈 취급 가능(제휴·거래 협의 단계) 업체는 ${avail.length}개사${avail.length?`로, ${avail.join(", ")}입니다`:"입니다"}.`;
  const fu=items.slice().sort((a,b)=>fuRank(a.fs)-fuRank(b.fs)).map(x=>({n:`${tag(x.page)}${x.c.name}`,act:followUpOf(x.fs,x.cts.map(ct=>ct.text))})).filter(f=>f.act).slice(0,8);
  const nextEnd=addDays(we,7);
  const rc=recontactRows(pages).filter(r=>r.due<=nextEnd).sort((a,b)=>(statusRank(a.p,a.c.status)-statusRank(b.p,b.c.status))||(b.over-a.over));
  const s5=`주요 협의사항 및 차주 후속 조치는 ${fu.length?fu.map(f=>`${f.n} - ${f.act}`).join(" / "):"주간 협의 내용에 따라 순차 진행"}입니다.${rc.length?` 재컨택 기한이 도래했거나 차주 내 도래 예정인 업체는 ${rc.length}개사이며, 우선 대상은 ${rc.slice(0,5).map(r=>`${tag(r.p)}${r.c.name}`).join(", ")} 등입니다.`:""}`;
  return [title,"","1. 주간 영업활동 현황",s1,"","2. 취급품목·사업 분야",s2,"","3. 업종·품목별 영업 동향 및 업체 반응",...s3,"","4. 신규 제휴 및 취급 가능 업체 현황",s4,"","5. 주요 협의사항 및 차주 후속 영업계획",s5].join("\n");
}
function renderDashReport(){
  if(!dash.repDate)dash.repDate=todayStr();
  const isW=dash.repType==="weekly";
  return `<div class="dcard"><h4>영업활동 보고서 자동 작성 <span class="dsub">선택한 ${isW?"주간":"일자"}의 컨택 이력을 기반으로 작성합니다</span></h4>
    <div class="dtools">
      <div class="pills"><button class="pill ${!isW?"active":""}" onclick="setRepType('daily')">Daily</button><button class="pill ${isW?"active":""}" onclick="setRepType('weekly')">Weekly</button></div>
      <input type="date" id="rep-date" value="${dash.repDate}" onchange="dash.repDate=this.value;genReport()"/>
      <span class="dsub" id="rep-range"></span>
      <button class="btn-primary" onclick="genReport()"><i class="ti ti-refresh"></i> 다시 생성</button>
      <button class="btn-sm" onclick="copyReport()" style="display:inline-flex;align-items:center;gap:5px;padding:7px 12px;"><i class="ti ti-copy"></i> 복사</button>
    </div>
    <textarea id="rep-text" class="rep-text"></textarea>
    <div class="dnote">컨택 이력의 취급품목·상태값·컨택 내용을 규칙에 따라 요약한 초안입니다. 필요하면 위 입력창에서 직접 수정한 뒤 [복사]를 눌러 사용하세요. (보고 범위: ${dash.scope==="all"?"구독·렌탈 통합":pageName(dash.scope)})</div></div>`;
}
function genReport(){
  const el=document.getElementById("rep-text");if(!el)return;
  const d=(document.getElementById("rep-date")||{}).value||dash.repDate||todayStr();
  dash.repDate=d;
  el.value=dash.repType==="weekly"?buildWeeklyReport(dash.scope,d):buildDailyReport(dash.scope,d);
  const r=document.getElementById("rep-range");
  if(r){const ws=weekStartStr(d);r.textContent=dash.repType==="weekly"?`${ws} ~ ${addDays(ws,6)} (월~일)`:"";}
}
async function copyReport(){
  const ta=document.getElementById("rep-text");if(!ta)return;
  try{await navigator.clipboard.writeText(ta.value);}catch(e){ta.select();document.execCommand("copy");}
  toast("보고서가 복사됐습니다");
}

/* ══ 초기화 ══ */
initMonthHeaders();
loadAll();
</script>
